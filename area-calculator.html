<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\" content=\"Area Calculator.\">\n    <meta name=\"keywords\" content=\"area, calculator, shapes\">\n    <meta name=\"robots\" content=\"index, follow\">\n    <link rel=\"canonical\" href=\"http://bestutils.com/area-calculator.html\">\n    <title>Area Calculator</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        .container { max-width: 600px; margin: auto; padding: 20px; }\n        input, button { margin: 5px 0; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>Area Calculator</h1>\n        <p>Calculate the area of different shapes.</p>\n        <label for=\"shape\">Choose a shape:</label>\n        <select id=\"shape\">\n            <option value=\"circle\">Circle</option>\n            <option value=\"rectangle\">Rectangle</option>\n            <option value=\"triangle\">Triangle</option>\n        </select>\n        <div id=\"inputs\">\n            <!-- Dynamic inputs will be inserted here -->\n        </div>\n        <button onclick=\"calculateArea()\">Calculate Area</button>\n        <div id=\"result\">\n            <h2>Result:</h2>\n            <p id=\"area\"></p>\n        </div>\n    </div>\n    <script>\n        document.getElementById(\"shape\").addEventListener(\"change\", function() {\n            const shape = this.value;\n            const inputsDiv = document.getElementById(\"inputs\");\n            if (shape === 'circle') {\n                inputsDiv.innerHTML = '<label for=\"radius\">Radius:</label><input type=\"number\" id=\"radius\">';\n            } else if (shape === 'rectangle') {\n                inputsDiv.innerHTML = '<label for=\"length\">Length:</label><input type=\"number\" id=\"length\"><label for=\"width\">Width:</label><input type=\"number\" id=\"width\">';\n            } else if (shape === 'triangle') {\n                inputsDiv.innerHTML = '<label for=\"base\">Base:</label><input type=\"number\" id=\"base\"><label for=\"height\">Height:</label><input type=\"number\" id=\"height\">';\n            }\n        });\n        function calculateArea() {\n            const shape = document.getElementById(\"shape\").value;\n            let area = 0;\n            if (shape === 'circle') {\n                const radius = parseFloat(document.getElementById(\"radius\").value);\n                area = Math.PI * radius * radius;\n            } else if (shape === 'rectangle') {\n                const length = parseFloat(document.getElementById(\"length\").value);\n                const width = parseFloat(document.getElementById(\"width\").value);\n                area = length * width;\n            } else if (shape === 'triangle') {\n                const base = parseFloat(document.getElementById(\"base\").value);\n                const height = parseFloat(document.getElementById(\"height\").value);\n                area = 0.5 * base * height;\n            }\n            document.getElementById(\"area\").textContent = area.toFixed(2) + ' square units';\n        }\n    </script>\n</body>\n</html>
