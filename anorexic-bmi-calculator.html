<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate your BMI with our anorexic BMI calculator to monitor your health.">
  <meta name="keywords" content="anorexic BMI calculator, health calculator, body mass index">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="http://bestutils.com/anorexic-bmi-calculator.html">
  <title>Anorexic BMI Calculator | BestUtils</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
    h1 { text-align: center; color: #2d3748; font-size: 2rem; margin-bottom: 16px; }
    label { display: block; margin: 12px 0 6px; color: #555; }
    input { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 6px; background: #3182ce; color: #fff; cursor: pointer; transition: background 0.2s; margin-top: 16px; }
    button:hover { background: #2b6cb0; }
    .result { margin-top: 20px; padding: 16px; background: #e2e8f0; border-radius: 6px; font-size: 1.2rem; text-align: center; }
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;justify-content:center;padding:24px 0 0 0;">
    <span style="font-size:2rem;font-weight:700;color:#222;letter-spacing:1px;">BEST<span style="color:#3182ce;">UTILS</span></span>
  </header>
  <div class="container">
    <h1>Anorexic BMI Calculator</h1>
    <p>Use this calculator to determine your Body Mass Index (BMI) and assess your health status. Simply enter your weight in kilograms and height in centimeters, then click 'Calculate' to see your BMI.</p>
    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" placeholder="Enter your weight in kilograms">
    <label for="height">Height (cm):</label>
    <input type="number" id="height" placeholder="Enter your height in centimeters">
    <button onclick="calculateBMI()">Calculate</button>
    <div class="result" id="result"></div>
  </div>
  <footer style="text-align:center;padding:16px 0;color:#777;font-size:0.9rem;">
    &copy; 2023 BestUtils. All rights reserved.
  </footer>
  <script>
    function calculateBMI() {
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value) / 100;

      const bmi = weight / (height * height);

      document.getElementById('result').textContent = `Your BMI is: ${bmi.toFixed(2)}`;
    }
  </script>
</body>
</html>
