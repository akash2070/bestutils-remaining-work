<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\" content=\"Army Body Fat Calculator.\">\n    <meta name=\"keywords\" content=\"army, body fat, calculator\">\n    <meta name=\"robots\" content=\"index, follow\">\n    <link rel=\"canonical\" href=\"http://bestutils.com/army-body-fat-calculator.html\">\n    <title>Army Body Fat Calculator</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        .container { max-width: 600px; margin: auto; padding: 20px; }\n        input, button { margin: 5px 0; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>Army Body Fat Calculator</h1>\n        <p>Calculate your body fat percentage according to army standards.</p>\n        <label for=\"neck\">Neck circumference (in inches):</label>\n        <input type=\"number\" id=\"neck\">\n        <label for=\"waist\">Waist circumference (in inches):</label>\n        <input type=\"number\" id=\"waist\">\n        <label for=\"height\">Height (in inches):</label>\n        <input type=\"number\" id=\"height\">\n        <button onclick=\"calculateBodyFat()\">Calculate Body Fat</button>\n        <div id=\"result\">\n            <h2>Result:</h2>\n            <p id=\"bodyFat\"></p>\n        </div>\n    </div>\n    <script>\n        function calculateBodyFat() {\n            const neck = parseFloat(document.getElementById(\"neck\").value);\n            const waist = parseFloat(document.getElementById(\"waist\").value);\n            const height = parseFloat(document.getElementById(\"height\").value);\n            const bodyFat = (waist - neck) / height * 100;\n            document.getElementById(\"bodyFat\").textContent = bodyFat.toFixed(2) + '% body fat';\n        }\n    </script>\n</body>\n</html>
