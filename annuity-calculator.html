<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An effective annuity calculator to help you plan your financial future.">
  <meta name="keywords" content="annuity calculator, financial planning, investment, retirement">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="http://bestutils.com/annuity-calculator.html">
  <title>Annuity Calculator | BestUtils</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
    h1 { text-align: center; color: #2d3748; font-size: 2rem; margin-bottom: 16px; }
    label { display: block; margin: 12px 0 6px; color: #555; }
    input { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 6px; background: #3182ce; color: #fff; cursor: pointer; transition: background 0.2s; margin-top: 16px; }
    button:hover { background: #2b6cb0; }
    .result { margin-top: 20px; padding: 16px; background: #e2e8f0; border-radius: 6px; font-size: 1.2rem; text-align: center; }
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;justify-content:center;padding:24px 0 0 0;">
    <span style="font-size:2rem;font-weight:700;color:#222;letter-spacing:1px;">BEST<span style="color:#3182ce;">UTILS</span></span>
  </header>
  <div class="container">
    <h1>Annuity Calculator</h1>
    <label for="principal">Principal Amount ($):</label>
    <input type="number" id="principal" placeholder="Enter the principal amount">
    <label for="rate">Annual Interest Rate (%):</label>
    <input type="number" id="rate" placeholder="Enter the annual interest rate">
    <label for="years">Number of Years:</label>
    <input type="number" id="years" placeholder="Enter the number of years">
    <button onclick="calculateAnnuity()">Calculate</button>
    <div class="result" id="result"></div>
  </div>
  <footer style="text-align:center;padding:16px 0;color:#777;font-size:0.9rem;">
    &copy; 2023 BestUtils. All rights reserved.
  </footer>
  <script>
    function calculateAnnuity() {
      const principal = parseFloat(document.getElementById('principal').value);
      const rate = parseFloat(document.getElementById('rate').value) / 100;
      const years = parseInt(document.getElementById('years').value);

      const annuity = principal * rate / (1 - Math.pow(1 + rate, -years));

      document.getElementById('result').textContent = `Estimated Annuity Payment: $${annuity.toFixed(2)}`;
    }
  </script>
</body>
</html>
